<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Module IA – Cluster & Âge</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script defer src="assets/js/ia.js"></script>
  <script defer src="assets/js/app.js"></script>
</head>

<body>
<header id="site-header"></header>

  <main class="container">
    <h2>Prédire cluster & âge d’un arbre</h2>

    <div class="form-grid">
      <label>Diamètre tronc (cm)
        <input type="number" id="diam-input" required>
      </label>
      <label>Hauteur totale (m)
        <input type="number" step="0.1" id="haut-input" required>
      </label>
      <label>Longitude
        <input type="number" step="0.000001" id="lon-input" required>
      </label>
      <label>Latitude
        <input type="number" step="0.000001" id="lat-input" required>
      </label>
    </div>

    <button id="cluster-btn">Prédire le cluster</button>
    <button id="age-btn">Prédire l’âge</button>

    <p id="result" class="message"></p>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
