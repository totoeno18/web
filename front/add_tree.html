<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un Arbre</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script defer src="assets/js/app.js"></script>
    <script defer src="assets/js/add_tree.js"></script>
</head>
<body>
    <header id="site-header"></header>

    <main class="container">
        <h2>Ajouter un nouvel arbre</h2>
        <form id="add-tree-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="height_total">Hauteur totale (m)</label>
                    <input type="number" step="0.1" id="height_total" name="height_total" required>
                </div>
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" step="0.1" id="age" name="age" required>
                </div>
                <div class="form-group">
                    <label for="trunk_diameter">Diamètre du tronc (cm)</label>
                    <input type="number" step="0.1" id="trunk_diameter" name="trunk_diameter" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="latitude">Latitude</label>
                    <input type="number" step="0.000001" id="latitude" name="latitude" required>
                </div>
                <div class="form-group">
                    <label for="longitude">Longitude</label>
                    <input type="number" step="0.000001" id="longitude" name="longitude" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="quartier">Quartier</label>
                    <input type="string" step="0.000001" id="quartier" name="quartier" required>
                </div>
                <div class="form-group">
                    <label for="secteur">Secteur</label>
                    <input type="string" step="0.000001" id="secteur" name="secteur" required>
                </div>
            </div>
            <div class="form-group">
                <label for="state">État de l'arbre</label>
                <select id="state" name="state" required>
                    <option value="EN PLACE">En place</option>
                    <option value="supprime">Supprimé</option>
                </select>
            </div>

            <button type="submit">Ajouter</button>
        </form>
        <p id="add-tree-message" class="message"></p>
    </main>

    <footer id="site-footer"></footer>
</body>
</html>
